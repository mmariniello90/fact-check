<!DOCTYPE html>
<html lang="__FC_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact-check</title>
<style>
:root{
  --surface-0:#f5f4ef;--surface-1:#faf9f5;--surface-2:#ffffff;
  --text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;
  --text-success:#3b6d11;--text-warning:#854f0b;--text-danger:#a32d2d;--text-accent:#185fa5;
  --bg-success:#eaf3de;--bg-warning:#faeeda;--bg-danger:#fcebeb;--bg-accent:#e6f1fb;
  --border:rgba(0,0,0,.10);--border-strong:rgba(0,0,0,.18);
  --border-success:#97c459;--border-warning:#ef9f27;--border-danger:#f09595;
  --radius:8px;
}
@media (prefers-color-scheme: dark){:root{
  --surface-0:#1a1a19;--surface-1:#222221;--surface-2:#2a2a28;
  --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;
  --text-success:#97c459;--text-warning:#fac775;--text-danger:#f09595;--text-accent:#85b7eb;
  --bg-success:#27500a;--bg-warning:#633806;--bg-danger:#791f1f;--bg-accent:#0c447c;
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.20);
  --border-success:#639922;--border-warning:#ba7517;--border-danger:#e24b4a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:16px 12px 32px}
.fc-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:.9rem 1rem;margin-bottom:10px}
.fc-lbl{margin:0 0 8px;font-size:12px;color:var(--text-muted)}
.fc-badge{display:inline-block;font-size:13px;font-weight:500;padding:4px 10px;border-radius:var(--radius);margin-bottom:8px}
.fc-badge .ti{vertical-align:-0.2em;margin-right:4px}
.fc-headline{margin:0 0 10px;font-size:15px;line-height:1.5}
.fc-counts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--text-secondary)}
.fc-text{margin:0;font-size:15px;line-height:1.85;white-space:pre-wrap}
.fc-cl{cursor:pointer;padding-bottom:1px}
.fc-cl:focus-visible,.fc-head:focus-visible,.fc-fu:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px;border-radius:2px}
.fc-head{display:flex;align-items:center;gap:8px;cursor:pointer}
.fc-body{margin-top:10px}
.fc-closed .fc-body{display:none}
.ti{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.18em;flex-shrink:0}
.fc-closed .ti-chevron-up{transform:rotate(180deg)}
.fc-ev{border-left:2px solid var(--border-strong);padding:2px 0 2px 10px;margin:8px 0}
.fc-ev p{margin:0;font-size:13px;font-style:italic;color:var(--text-secondary)}
.fc-ev a{font-size:12px;color:var(--text-accent);text-decoration:none}
.fc-chip{display:inline-block;background:var(--surface-1);padding:3px 8px;border-radius:var(--radius);font-size:12px;color:var(--text-secondary);margin:0 4px 4px 0;white-space:nowrap}
.fc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:0.5px solid var(--border)}
.fc-row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-row a{color:inherit;text-decoration:none}
.fc-last{border-bottom:none}
.fc-title{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-out{margin:0;font-size:13px;font-weight:500}
.fc-why{margin:4px 0 0;font-size:14px;line-height:1.5}
.fc-group{background:var(--surface-1);border-radius:var(--radius);padding:4px 10px;margin:6px 0}
.fc-group-lbl{margin:4px 0 0;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:2px 0 6px;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-om{margin:0 0 6px;font-size:14px;line-height:1.5}
.fc-om:last-child{margin-bottom:0}
.fc-fu{cursor:pointer}
.fc-foot{margin:6px 4px 2px;font-size:12px;color:var(--text-muted);line-height:1.5}
</style>
</head>
<body>

  if (!muted && (c.outcome === "supported" || c.critical)) {
    var n = c.independent_source_count;
    chips.push(el("span", {"class": "fc-chip", text: n ? n + " " + plural(L.indep, n) : L.no_indep}));
  }
  c.issues.forEach(function(i){ chips.push(el("span", {"class": "fc-chip", text: L.issue[i] || i})); });
  if (chips.length) body.appendChild(el("div", {style: "margin-top:8px"}, chips));
  var danger = c.outcome === "contradicted" || c.outcome === "unsupported";
  var cardEl = el("div", {"class": "fc-card fc-claim fc-closed", id: c.id, style: danger ? "border-color:var(--border-danger)" : ""}, [head, body]);
  root.appendChild(cardEl);
});

/* ---------------------------------------------------------------- 4. sources */
(function(){
  var cited = R.sources.filter(function(s){ return s.cited_in_original; }).length;
  var found = R.sources.length - cited;
  var parts = [];
  if (cited) parts.push(cited + " " + plural(L.cited, cited));
  if (found) parts.push(found + " " + plural(L.found, found));
  var ng = R.origin_groups.length;
  parts.push(ng + " " + plural(L.origins, ng));
  var c = card([el("p", {"class": "fc-lbl", text: L.sources + " · " + parts.join(", ")})]);

  function sourceRow(s){
    var meta = " · " + (L.type[s.type] || s.type) + " · " + (s.published_at ? s.published_at.slice(0, 4) : L.undated);
    var rs = REL_STYLE[s.reliability.level];
    var row = el("div", {"class": "fc-row"}, [
      el("span", {title: s.title}, [el("a", {href: safeUrl(s.url), target: "_blank", rel: "noopener noreferrer"}, [s.publisher]),
                                    el("span", {style: "color:var(--text-muted)", text: meta})]),
      el("span", {style: "color:" + v(rs.fg) + ";white-space:nowrap", title: s.reliability.reason + " — " + s.reliability.lateral_check},
         [icon(rs.icon), " " + L.rel[s.reliability.level]])
    ]);
    var out = [row];
    if (s.access.status !== "full") {
      var txt = (s.access.issue ? (L.access[s.access.issue] || s.access.issue) + " · " : "") + L.access_status[s.access.status];
      out.push(el("p", {"class": "note"}, [icon("ti-lock"), " " + txt]));
    }
    if (s.conflict_of_interest)
      out.push(el("p", {"class": "note", title: s.conflict_of_interest}, [icon("ti-info-circle"), " " + s.conflict_of_interest]));
    return out;
  }

  var blocks = [];
  R.origin_groups.forEach(function(g){
    var srcs = g.source_ids.map(function(id){ return srcById[id]; }).filter(Boolean);
    if (srcs.length === 1) { blocks.push({nodes: sourceRow(srcs[0]), boxed: false}); return; }
    var box = el("div", {"class": "fc-group"}, [el("p", {"class": "fc-group-lbl", title: g.label}, [icon("ti-link"), " " + L.same_origin + g.label])]);
    srcs.forEach(function(s, i){
      var nodes = sourceRow(s);
      if (i === srcs.length - 1) nodes[0].classList.add("fc-last");
      nodes.forEach(function(n){ box.appendChild(n); });
    });
    blocks.push({nodes: [box], boxed: true});
  });
  blocks.forEach(function(b, i){
    if (i === blocks.length - 1 && !b.boxed) {
      var hasNote = b.nodes.length > 1;
      if (!hasNote) b.nodes[0].classList.add("fc-last");
      else { b.nodes[0].classList.add("fc-last"); b.nodes[b.nodes.length - 1].style.marginBottom = "0"; }
    }
    b.nodes.forEach(function(n){ c.appendChild(n); });
  });
  root.appendChild(c);
})();

/* ---------------------------------------------------------------- 5. omissions and follow-ups */
if (R.omissions.length) {
  var oc = card([el("p", {"class": "fc-lbl", text: L.omissions})]);
  R.omissions.forEach(function(o){
    oc.appendChild(el("p", {"class": "fc-om"}, [icon(OMISSION_ICON[o.type] || "ti-puzzle", "color:var(--text-secondary)"), " " + o.description]));
  });
  root.appendChild(oc);
}
if (R.follow_ups.length) {
  var fc = card([el("p", {"class": "fc-lbl", text: L.follow_ups})]);
  R.follow_ups.forEach(function(f, i){
    var row = el("div", {"class": "fc-row" + (i === R.follow_ups.length - 1 ? " fc-last" : "") + (f.claim_id ? " fc-fu" : "")},
      [el("span", {style: "white-space:normal"}, [icon("ti-arrow-right", "color:var(--text-accent)"), " " + f.text])]);
    if (f.claim_id) { row.setAttribute("data-c", f.claim_id); row.setAttribute("role", "button"); row.setAttribute("tabindex", "0"); }
    fc.appendChild(row);
  });
  root.appendChild(fc);
}

/* ---------------------------------------------------------------- 6. footer */
(function(){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(R.meta.checked_at) || [];
  var date = m.length ? L.date(m[1], m[2], m[3]) : R.meta.checked_at;
  root.appendChild(el("p", {"class": "fc-foot", text: L.footer_mode[R.meta.verifier_mode] + " " + L.footer_date + date + "."}));
})();

/* ---------------------------------------------------------------- interaction
   Claim cards start collapsed. Tapping a claim in the text (or a follow-up) opens its
   card and closes the others; tapping a card header toggles it. */
var cards = Array.prototype.slice.call(document.querySelectorAll(".fc-claim"));
function setOpen(c, open){
  c.classList.toggle("fc-closed", !open);
  c.querySelector(".fc-head").setAttribute("aria-expanded", open ? "true" : "false");
}
function openOnly(id){
  var t = document.getElementById(id);
  if (!t) return;
  cards.forEach(function(c){ setOpen(c, c === t); });
  t.scrollIntoView({behavior: "smooth", block: "nearest"});
}
function onActivate(node, fn){
  node.addEventListener("click", fn);
  node.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } });
}
cards.forEach(function(c){
  onActivate(c.querySelector(".fc-head"), function(){ setOpen(c, c.classList.contains("fc-closed")); });
});
Array.prototype.forEach.call(document.querySelectorAll("[data-c]"), function(s){
  if (s.classList.contains("fc-claim")) return;
  onActivate(s, function(){ openOnly(s.getAttribute("data-c")); });
});
document.title = L.status[R.verdict.status] + " · Fact-check";
})();
</script>
</body>
</html>
